server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets + recipe images: cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /img/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # WebSocket relay (live room sync): upgrade pass-through to the relay service.
  # The forwarded client address is what the relay's per-IP brute-force
  # throttle keys on — without it every household shares the relay's view
  # of nginx's own container IP and one client's budget starves the rest.
  location /ws {
    proxy_pass http://relay:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Overwrite (not append!) the forwarded address: a client-supplied
    # X-Forwarded-For must not survive, or the client picks its own
    # throttle bucket. One hop behind nginx → the single $remote_addr is
    # the established client address (CodeRabbit round 2).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}