name: Set up Bun with dependency cache
description: setup-bun + cached bun install cache, then bun install --frozen-lockfile

# Every workflow job that installs deps funnels through here so the cache
# wiring exists in ONE place. setup-bun@v2 caches the Bun EXECUTABLE only —
# the downloaded packages (bun's global install cache under
# ~/.bun/install/cache) are cached separately here, keyed on bun.lock so a
# dependency change invalidates it and everything else restores.
# bun install itself stays UNconditional: --frozen-lockfile must always run
# to materialize node_modules and verify the lockfile is in sync with
# package.json — the cache only speeds it up, it never replaces it.

inputs:
  bun-version:
    description: The version of Bun to install (setup-bun's input).
    required: false
    default: latest
  install:
    description: Run `bun install --frozen-lockfile` after setup ('true'/'false').
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache the bun install cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
