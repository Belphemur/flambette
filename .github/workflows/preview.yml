name: preview

# PR visual QA: a real, human-openable URL for every PR, plus PNGs of the
# main routes in the PR comment. This does NOT gate the merge (it is not in
# `needs:` of merge-gate) — it exists so a human can click once and look at
# the change on a phone-shaped viewport before approving.
#
# Hosting: Cloudflare Pages direct upload (the free tier needs no card and
# exposes the CLOUDFLARE_* secrets below). The app is a pure static SPA —
# 8,198 files / 61 MB, largest single file 3.4 MB — so it uploads as-is
# and needs no build step on the host. The SPA fallback (_redirects) is
# committed, so deep links like /plan resolve instead of 404ing.
#
# The room/relay WebSocket is NOT part of this preview: rooms need a
# long-lived stateful relay, which a static host cannot provide. Room QA
# stays on a real deployment (docker compose / the VPS).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Capture route screenshots
        run: |
          bunx vite preview --port 4173 --host 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1 && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:4173 SHOT_DIR=screenshots bun scripts/screenshots.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pr-screenshots
          path: screenshots/
          retention-days: 7

  deploy:
    name: Preview deploy
    needs: screenshots
    runs-on: ubuntu-latest
    # Skip (do not fail) when the Cloudflare secrets are absent, so a fork
    # or a fresh clone still gets a green run.
    if: ${{ github.event_name == 'workflow_dispatch' || secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Pages (direct upload)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # One Pages project per PR keeps previews isolated and disposable.
          PAGES_PROJECT: pr-${{ github.event.pull_request.number }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="${{ github.event.pull_request.number }}" \
            --commit-dirty=true
          echo "DEPLOYED" >> "$GITHUB_ENV"

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://pr-${{ github.event.pull_request.number }}.pages.dev`
            const marker = '<!-- preview-url -->'
            const body = [
              marker,
              '### 👀 Live preview',
              '',
              `**${url}** — deployed from this PR's head commit.`,
              '',
              'Static build: the Recipes/Plan/Grocery/History/Settings tabs are fully usable.',
              'Room sync is not (a static host cannot run the stateful relay) — QA that on a real deploy.',
              '',
              'Route screenshots are in the `pr-screenshots` artifact of the Screenshots job.',
            ].join('\n')
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
