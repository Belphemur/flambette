name: Preview

# Preview deployments of BOTH workers (ADR-0039): a `wrangler preview` of the
# relay and the SPA per PR / per main push. Previews live on preview-only
# hosts under dev.flambette.app — never on a production hostname — and the
# preview SPA talks to ITS OWN preview relay, whose rooms live in the
# preview's isolated Durable Object namespace. The URLs are DETERMINISTIC
# (pr-<N>.relay.dev.flambette.app), so the two jobs run in parallel with no
# push. Only the WEB preview creates a GitHub deployment (ADR-0091): the
# relay job passes no gitHubToken, so each PR surfaces ONE GitHub
# deployment on environment `pr-<N>` (the action uses the wrangler preview
# name verbatim as the environment) instead of two. Production deploys
# happen only in release.yml, on a `v*` tag.

on:
  pull_request:
    # `closed` is not in the default event types but the cleanup job needs
    # it — preview rooms are destroyed when the PR is merged or closed.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  # A close (cleanup) supersedes an in-flight preview push for the same PR.
  cancel-in-progress: true

jobs:
  relay:
    if: github.event.action != 'closed' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/bun-setup

      - name: Preview the relay worker
        id: preview-relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          # NO `gitHubToken` on purpose (ADR-0091): the relay preview must NOT
          # create a GitHub deployment — that right belongs to the web job
          # alone, so each PR owns ONE environment (`pr-<N>`) with ONE
          # deployment. wrangler-action creates a deployment whenever a
          # GITHUB_TOKEN is configured (verified in wrangler-action source:
          # createPreviewGitHubDeploymentAndJobSummary early-returns without
          # one); omitting it here is the only switch.
          command: preview --name pr-${{ github.event.pull_request.number || 'main' }} --config server/wrangler.jsonc
        # NO `environment` input on purpose: the action feeds it to wrangler's
        # --env, which renames the preview worker (flambette-preview-...-<env>),
        # and env-suffixed preview workers do NOT bind the custom-domain
        # preview routes (verified live: base-name previews get
        # pr-<N>.{app,relay}.dev.flambette.app active immediately; env-suffixed
        # ones never do — "none are active"). Without it the preview runs under
        # the base worker name and the custom-domain URLs work.
        #
        # `wrangler preview` reads its credential from the ENVIRONMENT, not
        # from the action's apiToken input (verified live on this PR's first
        # run: "In a non-interactive environment, it's necessary to set a
        # CLOUDFLARE_API_TOKEN environment variable").
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The SPA preview points at THIS PR's relay preview
  # (pr-<N>.relay.dev.flambette.app), so preview rooms live entirely inside
  # the preview's isolated DO namespace. The URL is deterministic, so this
  # job runs in PARALLEL with the relay job — the relay preview exists before
  # anyone opens the SPA preview URL.
  web:
    if: github.event.action != 'closed' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The app version is baked from git facts (vite.config.ts) — tags
        # included, or the header would fall back to dev-<sha>.
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bun-setup

      - name: Build SPA (this PR's relay preview origin)
        run: bun run build
        env:
          # THIS PR's relay preview on its custom domain — active as soon as
          # the relay preview exists (verified live: pr-main.relay.dev
          # .flambette.app answers with the relay's health JSON). The rooms
          # the preview SPA creates live in that preview's isolated DO
          # namespace, never in production data.
          VITE_RELAY_WS_URL: wss://pr-${{ github.event.pull_request.number || 'main' }}.relay.dev.flambette.app/ws
          # PR events set GITHUB_SHA to the synthetic merge commit — the
          # header must show the PR's own head sha (review #9).
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Preview the web worker
        id: preview-web
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.155.0"
          # The ONLY step that creates the PR's GitHub deployment (ADR-0091):
          # the relay job passes no gitHubToken. The action uses the wrangler
          # preview name (`pr-<N>`) verbatim as the GitHub environment.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: preview --name pr-${{ github.event.pull_request.number || 'main' }}
        # Same reasoning as the relay job: no `environment` input — an env
        # suffix renames the preview worker and the custom-domain preview
        # routes stop binding.
        #
        # `wrangler preview` reads its credential from the ENVIRONMENT, not
        # from the action's apiToken input (verified live on this PR's first
        # run: "In a non-interactive environment, it's necessary to set a
        # CLOUDFLARE_API_TOKEN environment variable").
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Preview rooms are auto-destroyed when the PR is merged or closed: each
  # preview's rooms live in that preview's OWN Durable Object namespace, and
  # deleting the preview deletes the namespace with its storage. Preview
  # names are scoped per Worker, so BOTH workers' previews go. The PR's
  # GitHub deployments (environment `pr-<N>`, created by the web job) are
  # deleted too (ADR-0091): first an `inactive` status (GitHub requires a
  # deployment to be inactive before it can be deleted), then the deletion —
  # with the environment left empty, it disappears from the Deployments page.
  # `deployments: write` (workflow-level) is all GITHUB_TOKEN needs; deleting
  # the ENVIRONMENT itself is not possible from Actions (it requires
  # `administration: write`, which the token cannot hold).
  cleanup:
    # Fork PRs get no secrets — there is no preview of theirs to clean up.
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/bun-setup
        with:
          install: false

      - name: Delete the web preview
        run: bunx wrangler@4.136.3 preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete the relay preview
        run: bunx wrangler@4.136.3 preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation --config server/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete the PR's GitHub deployments
        run: |
          set -euo pipefail
          env_name="pr-${{ github.event.pull_request.number }}"
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=${env_name}" --paginate --jq '.[].id' || true)
          if [ -z "$ids" ]; then
            echo "No GitHub deployments on environment ${env_name} — nothing to delete."
            exit 0
          fi
          for id in $ids; do
            echo "Deleting deployment ${id} (environment ${env_name})"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
              -f state=inactive \
              -f description="Preview deleted (PR closed)"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/deployments/${id}"
          done
          echo "Deleted all ${env_name} deployments."
        env:
          GH_TOKEN: ${{ github.token }}
