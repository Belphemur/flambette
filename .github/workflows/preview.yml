name: pr-preview

# Per-PR preview deploy for human visual QA.
#
# Why Vercel and not Cloudflare Pages: the Hobby tier is free, needs no
# card, and integrates with GitHub natively. The repo is PUBLIC, which is
# the actual requirement, not a caveat — Hobby refuses private repos in an
# org. Netlify's Deploy Previews are the equivalent alternative.
#
# This does NOT gate the merge (it is deliberately not in `needs:` of
# merge-gate) — it exists so a human can click once and look at the change
# on a phone-shaped viewport before approving.
#
# The room/relay WebSocket is NOT part of this preview: rooms need a
# long-lived stateful relay, which a static host cannot provide. Room QA
# stays on a real deployment (docker compose / the VPS).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Never block the PR: a preview failure must not turn the checks red.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel build` runs the project's real build (Vite) on OUR runner,
      # so the preview is built with the same toolchain CI gates on and we
      # keep our own build/test gates authoritative. `vercel deploy
      # --prebuilt` then ships only `.vercel/output` — no double build.
      - name: Build for Vercel
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        id: deploy
        run: |
          vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" \
            --name="pr-${{ github.event.pull_request.number || github.run_id }}" \
            | tee deploy.log
          # The CLI prints the preview URL to stdout but sets no
          # GITHUB_OUTPUT, so read it back out of the log rather than
          # assuming a step output exists.
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' deploy.log | tail -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- pr-preview-url -->';
            const body = [
              marker,
              '### Preview for QA',
              '',
              `[Open the preview](${url}) — build \`${{ github.event.pull_request.head.sha }}\``,
              '',
              'Click it, then use device emulation (phone width) to check the change.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
