name: Preview

# Preview deployments of BOTH workers (ADR-0039): a `wrangler preview` of the
# SPA and the relay per PR / per main push, each surfaced as a GitHub
# deployment (that is what `deployments: write` + `gitHubToken` buy). Preview
# URLs are stable per name and never touch the production routes or domains —
# production deploys happen only in release.yml, on a `v*` tag.

on:
  pull_request:
    # `closed` is not in the default event types but the cleanup job needs
    # it — preview rooms are destroyed when the PR is merged or closed.
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # The app version is baked from git facts (vite.config.ts) — tags
        # included, or the header would fall back to dev-<sha>.
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A preview SPA has no relay behind its own origin (preview deployments
      # never change routes), so it talks to the PRODUCTION relay — the same
      # hosted origin a released SPA uses (ADR-0038 §5).
      - name: Build SPA (hosted relay origin)
        run: bun run build
        env:
          VITE_RELAY_WS_URL: wss://ws.flambette.app/ws

      - name: Preview the web worker
        id: preview-web
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: preview --name pr-${{ github.event.pull_request.number || 'main' }}
        # `wrangler preview` reads its credential from the ENVIRONMENT, not
        # from the action's apiToken input (verified live on this PR's first
        # run: "In a non-interactive environment, it's necessary to set a
        # CLOUDFLARE_API_TOKEN environment variable").
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Preview rooms are auto-destroyed when the PR is merged or closed: each
  # preview's rooms live in that preview's OWN Durable Object namespace, and
  # deleting the preview deletes the namespace with its storage. Preview
  # names are scoped per Worker, so BOTH workers' previews go.
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-cleanup-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Delete the web preview
        run: bunx wrangler@4.136.3 preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete the relay preview
        run: bunx wrangler@4.136.3 preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation --config server/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  relay:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Preview the relay worker
        id: preview-relay
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: preview --name pr-${{ github.event.pull_request.number || 'main' }} --config server/wrangler.jsonc
        # Same as the web job: the preview command reads CLOUDFLARE_API_TOKEN
        # from the environment.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
