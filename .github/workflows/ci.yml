name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One push to a ref supersedes the previous run for that same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dynamic e2e sharding: one cheap "plan" job counts the tests Playwright
  # will run (list run — no build, no browsers) and derives the shard count
  # from that number, so the matrix grows with the suite instead of being
  # pinned at a fixed 4. The shard count is ceil(tests / TESTS_PER_SHARD),
  # clamped to [MIN, MAX] so a tiny suite doesn't collapse to one runner and
  # a huge one doesn't fan out unbounded. Adding a spec file needs NO matrix
  # edit — Playwright's own sharding guarantees every shard slices the same
  # full list, so no file can silently fall outside the run.
  e2e-plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/bun-setup

      - name: Compute shard count from the test list
        id: plan
        env:
          TESTS_PER_SHARD: '100'
          MIN_E2E_SHARDS: '2'
          MAX_E2E_SHARDS: '10'
        run: |
          bunx playwright test --list --reporter=json > pw-list.json
          # Tests (not specs): each spec runs once per project in the config
          # (Desktop Chrome + Pixel 7), and Playwright sharding balances
          # tests, so the project-multiplied count is the real denominator.
          total=$(jq '[recurse(.suites[]?) | .specs[]? | .tests[]?] | length' pw-list.json)
          if [[ -z "$total" || "$total" -eq 0 ]]; then
            echo "test list produced $total tests — refusing to plan a run" >&2
            exit 1
          fi
          shards=$(( (total + TESTS_PER_SHARD - 1) / TESTS_PER_SHARD ))
          if (( shards < MIN_E2E_SHARDS )); then shards=$MIN_E2E_SHARDS; fi
          if (( shards > MAX_E2E_SHARDS )); then shards=$MAX_E2E_SHARDS; fi
          echo "tests=$total -> shards=$shards (target $TESTS_PER_SHARD/shard)"
          # A JSON array for fromJSON: [1,2,...,N]
          echo "shards=[$(seq -s, 1 "$shards")]" >> "$GITHUB_OUTPUT"

  # Sharded e2e: one matrix job per computed shard. strategy.job-total is
  # the matrix size from e2e-plan's output, so --shard=N/T needs no second
  # matrix axis to keep in sync.
  e2e:
    needs: e2e-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        # Full history so the baked app version sees the reachable tag
        # instead of degrading to dev-<sha> (review #8).
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bun-setup

      - uses: ./.github/actions/playwright-browsers

      - name: Build
        run: bun run build

      - name: Run e2e shard ${{ matrix.shard }}
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/bun-setup

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Data-generator goldens
        # The committed public/data artifacts are build-time derivations, so
        # the invariants behind them (ADR-0012/ADR-0052 ingredient index,
        # ADR-0043 recipe types, ADR-0041 timer hints) need a gate too — a
        # hand-authored table that shadows the catalog is invisible to
        # bun test. Also covers docs/design/index.md, the generated ADR index
        # AGENTS.md links.
        run: bun run test:data

      - name: Committed ingredient index is not stale
        # The goldens read the COMMITTED artifact (the build and the release
        # both consume it), so a table edit that was never regenerated has to
        # fail here. Script form of the same assertion the goldens make.
        run: python3 scripts/extract_ingredients.py --check

      - name: Committed ADR index is not stale
        # An ADR landing without a regenerated index.md leaves AGENTS.md
        # pointing at a table that omits the new record — the drift the
        # generated index exists to remove.
        run: python3 scripts/build_adr_index.py --check

      - name: Committed changelog is not stale
        # The changelog is a committed artifact (ADR-0060). A release PR
        # squash-merge adds a tag that makes the committed file stale —
        # `bun run data:changelog` BEFORE tagging is the release procedure,
        # and --check is the forcing function.
        run: python3 scripts/build_changelog.py --check

  # The Cloudflare relay (ADR-0038): type-check the worker against the
  # generated runtime types, then drive the Room Durable Object in real
  # workerd. Without this job a worker type error or a failing DO spec
  # could merge and only surface on a tag's Workers Build.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/bun-setup

      - name: Worker types are up to date
        run: |
          bun run types:worker
          git diff --exit-code -- server/worker-configuration.d.ts

      - name: Type-check the worker
        run: bun run typecheck:worker

      - name: Durable Object tests (workerd)
        run: bun run test:worker

  # Merge gate: combine the shard blobs into the single HTML report and
  # fail if any shard failed. Every PR must pass this before squash-merge
  # (required status check "merge-gate").
  merge-gate:
    needs: [e2e, unit, worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/bun-setup

      - name: Download shard blobs
        uses: actions/download-artifact@v8
        with:
          path: blob-reports/
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge shard reports
        run: bunx playwright merge-reports --reporter=html blob-reports/

      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Hard gate: e2e, unit and the worker jobs must ALL have succeeded.
      - name: Enforce green
        run: |
          e2e="${{ needs.e2e.result }}"
          unit="${{ needs.unit.result }}"
          worker="${{ needs.worker.result }}"
          [[ "$e2e" == "success" && "$unit" == "success" && "$worker" == "success" ]] || { echo "e2e=$e2e unit=$unit worker=$worker"; exit 1; }

  docker:
    needs: merge-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build .

      - name: Build relay Docker image
        # Context is the repo root, not ./server: relay-core/codes.ts re-exports
        # src/lib/roomWords.ts (ADR-0040 allows exactly one src/ import), so a
        # server-only context ships an image that crash-loops on startup.
        run: docker build -f server/Dockerfile -t flambette-relay:ci .

      # A successful build proves nothing about startup: the relay image once
      # shipped without ./throttle.mjs, so it crash-looped on `bun relay.ts`
      # while `docker build` stayed green (issue #6). It now also has to
      # carry server/relay-core/ and src/lib/roomWords.ts, which the Dockerfile
      # copies. Run it and require a real HTTP 200 off the health endpoint
      # before the image is considered good.
      #
      # Since ADR-0088 the relay also has to PERSIST: RELAY_DB_PATH points
      # at a temporary path inside the container (no volume — the point is
      # the file, not the mount), a create + state push runs against the
      # live socket, and the SQLite database is then opened read-only to
      # prove the per-store row landed — the volume story without a volume.
      - name: Smoke-run relay image
        run: |
          docker run -d --name relay-smoke -p 18081:8081 \
            -e RELAY_DB_PATH=/tmp/ci-relay.sqlite3 flambette-relay:ci
          # Relay answers plain HTTP on non-upgrade requests, so poll it.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18081/ >/dev/null 2>&1; then
              echo "relay responded after ${i}s"
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' relay-smoke 2>/dev/null | grep -q true; then
              echo "relay container exited before serving:" >&2
              docker logs relay-smoke >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:18081/ || {
            echo "relay never served HTTP within 30s:" >&2
            docker logs relay-smoke >&2
            exit 1
          }
          echo "relay image serves HTTP"
          cat >/tmp/ci_push_client.ts <<'EOF'
          const ws = new WebSocket('ws://localhost:8081/?op=create&room=cismoke000')
          ws.addEventListener('message', (ev) => {
            const msg = JSON.parse(ev.data as string)
            if (msg.type === 'created') {
              ws.send(JSON.stringify({ type: 'state', rev: 1, state: { plan: [{ variantId: 1, servings: 2 }] } }))
              // The push has no ack (the fan-out goes to other peers); give
              // the relay a moment to store it before this client exits.
              setTimeout(() => process.exit(0), 500)
            }
          })
          ws.addEventListener('error', () => {
            console.error('smoke client: websocket error')
            process.exit(1)
          })
          setTimeout(() => {
            console.error('smoke client: never answered created')
            process.exit(1)
          }, 10_000)
          EOF
          docker cp /tmp/ci_push_client.ts relay-smoke:/tmp/ci_push_client.ts
          docker exec relay-smoke bun /tmp/ci_push_client.ts || {
            echo "create+push smoke failed:" >&2
            docker logs relay-smoke >&2
            exit 1
          }
          test -s /tmp/ci-relay.sqlite3 || {
            echo "relay did not create its SQLite database" >&2
            exit 1
          }
          docker exec relay-smoke bun -e 'const { Database } = require("bun:sqlite"); const db = new Database(process.env.RELAY_DB_PATH); const rows = db.query("SELECT value FROM store_plan").all(); if (rows.length < 1) { console.error("store_plan row missing after the push"); process.exit(1) } console.log("store_plan rows:", rows.length)'
          echo "relay image persists room state"

      - name: Relay image smoke logs
        if: always()
        run: docker logs relay-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f relay-smoke || true
