name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One push to a ref supersedes the previous run for that same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sharded e2e: one chromium project per shard, run in a matrix so the
  # whole suite parallelizes across runners and each job fails with its
  # own focused report. Shards must sum to the full spec list —
  # add a spec file? extend BOTH shard globs (a file matched by no shard
  # silently never runs in CI).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v7
        # Full history so the baked app version sees the reachable tag
        # instead of degrading to dev-<sha> (review #8).
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run e2e shard ${{ matrix.shard }}
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

      - name: Data-generator goldens
        # The committed public/data artifacts are build-time derivations, so
        # the invariants behind them (ADR-0012/ADR-0052 ingredient index,
        # ADR-0043 recipe types, ADR-0041 timer hints) need a gate too — a
        # hand-authored table that shadows the catalog is invisible to
        # bun test.
        run: bun run test:data

      - name: Committed ingredient index is not stale
        # The goldens read the COMMITTED artifact (the build and the release
        # both consume it), so a table edit that was never regenerated has to
        # fail here. Script form of the same assertion the goldens make.
        run: python3 scripts/extract_ingredients.py --check

  # The Cloudflare relay (ADR-0038): type-check the worker against the
  # generated runtime types, then drive the Room Durable Object in real
  # workerd. Without this job a worker type error or a failing DO spec
  # could merge and only surface on a tag's Workers Build.
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Worker types are up to date
        run: |
          bun run types:worker
          git diff --exit-code -- server/worker-configuration.d.ts

      - name: Type-check the worker
        run: bun run typecheck:worker

      - name: Durable Object tests (workerd)
        run: bun run test:worker

  # Merge gate: combine the shard blobs into the single HTML report and
  # fail if any shard failed. Every PR must pass this before squash-merge
  # (required status check "merge-gate").
  merge-gate:
    needs: [e2e, unit, worker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download shard blobs
        uses: actions/download-artifact@v8
        with:
          path: blob-reports/
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge shard reports
        run: bunx playwright merge-reports --reporter=html blob-reports/

      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Hard gate: e2e, unit and the worker jobs must ALL have succeeded.
      - name: Enforce green
        run: |
          e2e="${{ needs.e2e.result }}"
          unit="${{ needs.unit.result }}"
          worker="${{ needs.worker.result }}"
          [[ "$e2e" == "success" && "$unit" == "success" && "$worker" == "success" ]] || { echo "e2e=$e2e unit=$unit worker=$worker"; exit 1; }

  docker:
    needs: merge-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build .

      - name: Build relay Docker image
        # Context is the repo root, not ./server: relay-core/codes.ts re-exports
        # src/lib/roomWords.ts (ADR-0040 allows exactly one src/ import), so a
        # server-only context ships an image that crash-loops on startup.
        run: docker build -f server/Dockerfile -t flambette-relay:ci .

      # A successful build proves nothing about startup: the relay image once
      # shipped without ./throttle.mjs, so it crash-looped on `bun relay.ts`
      # while `docker build` stayed green (issue #6). It now also has to
      # carry server/relay-core/ and src/lib/roomWords.ts, which the Dockerfile
      # copies. Run it and require a real HTTP 200 off the health endpoint
      # before the image is considered good.
      - name: Smoke-run relay image
        run: |
          docker run -d --name relay-smoke -p 18081:8081 flambette-relay:ci
          # Relay answers plain HTTP on non-upgrade requests, so poll it.
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18081/ >/dev/null 2>&1; then
              echo "relay responded after ${i}s"
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' relay-smoke 2>/dev/null | grep -q true; then
              echo "relay container exited before serving:" >&2
              docker logs relay-smoke >&2
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:18081/ || {
            echo "relay never served HTTP within 30s:" >&2
            docker logs relay-smoke >&2
            exit 1
          }
          echo "relay image serves HTTP"

      - name: Relay image smoke logs
        if: always()
        run: docker logs relay-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f relay-smoke || true
