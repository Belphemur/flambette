name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Sharded e2e: one chromium project per shard, run in a matrix so the
  # whole suite parallelizes across runners and each job fails with its
  # own focused report. Shards must sum to the full spec list —
  # add a spec file? extend BOTH shard globs (a file matched by no shard
  # silently never runs in CI).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        run: bun run build

      - name: Run e2e shard ${{ matrix.shard }}
        run: bunx playwright test --shard=${{ matrix.shard }}/${{ matrix.total }}

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test:unit

  # Merge gate: combine the shard blobs into the single HTML report and
  # fail if any shard failed. Every PR must pass this before squash-merge
  # (required status check "merge-gate").
  merge-gate:
    needs: [e2e, unit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download shard blobs
        uses: actions/download-artifact@v4
        with:
          path: blob-reports/
          pattern: playwright-blob-*
          merge-multiple: true

      - name: Merge shard reports
        run: bunx playwright merge-reports --reporter=html blob-reports/

      - name: Upload merged Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Hard gate: e2e and unit jobs must BOTH have succeeded.
      - name: Enforce green
        run: |
          e2e="${{ needs.e2e.result }}"
          unit="${{ needs.unit.result }}"
          [[ "$e2e" == "success" && "$unit" == "success" ]] || { echo "e2e=$e2e unit=$unit"; exit 1; }

  docker:
    needs: merge-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build .

      - name: Build relay Docker image
        run: docker build ./server
