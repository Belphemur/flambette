name: release

on:
  push:
    tags:
      - 'v*'

# Releases share ONE group — two tags pushed in quick succession queue
# instead of racing (ADR-0039). A per-ref group would give each tag its own
# lane and let an older tag's wrangler deploy finish last.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ADR-0060 §7 (as amended): the changelog is generated BY CI at tagging
  # time — deterministic from the semantic commits in each tag's range —
  # and committed back to main through the GraphQL API, whose commits
  # GitHub signs server-side (the "Verified" badge; no GPG key to manage).
  # The regenerated artifact ALSO rides to the web/image builds as a
  # workflow artifact, so the release documents itself even though the
  # commit-back necessarily lands on main after the tag it documents.
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate the changelog from the tag space
        run: |
          python3 scripts/build_changelog.py
          python3 scripts/test_build_changelog.py

      - name: Upload the artifact for the image/worker builds
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: public/data/changelog.json

      - name: Skip when main already carries this artifact (workflow retry)
        id: state
        run: |
          if git diff --quiet origin/main -- public/data/changelog.json; then
            echo "state=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "state=pending" >> "$GITHUB_OUTPUT"
          fi

      # The commit-back needs an actor that (a) BYPASSES the main-protection
      # ruleset's pull_request gate and (b) still lands a SIGNED commit (the
      # ruleset also requires signatures). The RELEASER GitHub App covers
      # both: it is a ruleset bypass actor (Integration, the one actor type
      # a user-owned repo CAN grant — the official github-actions app is
      # rejected because it belongs to GitHub, not the repo owner), and a
      # CreateCommitOnBranch commit made with its installation token is
      # signed by GitHub server-side (verified: true, reason: valid).
      # Secrets: RELEASER_APP_ID + RELEASER_PRIVATE_KEY (the app's .pem).
      - name: Generate the RELEASER app token
        id: releaser
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_PRIVATE_KEY }}

      - name: Commit to main (GitHub-signed)
        if: steps.state.outputs.state == 'pending'
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
        run: |
          CONTENT=$(base64 -w0 public/data/changelog.json)
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          HEADLINE="chore(release): changelog for ${GITHUB_REF_NAME}"
          QUERY='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){ref(qualifiedName:"refs/heads/main"){target{oid}}}}'
          MUTATION='mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}'
          for attempt in 1 2 3 4 5; do
            HEAD_OID=$(gh api graphql -f query="$QUERY" -f owner="$OWNER" -f name="$NAME" --jq '.data.repository.ref.target.oid')
            INPUT=$(jq -nc \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg oid "$HEAD_OID" --arg msg "$HEADLINE" --arg content "$CONTENT" \
              '{
                 branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                 expectedHeadOid: $oid,
                 message: {headline: $msg},
                 fileChanges: {additions: [{path: "public/data/changelog.json", contents: $content}]}
               }')
            BODY=$(jq -nc --arg q "$MUTATION" --argjson input "$INPUT" '{query: $q, variables: {input: $input}}')
            if OUT=$(printf '%s' "$BODY" | gh api graphql --input - 2>&1); then
              echo "Committed: $(printf '%s' "$OUT" | jq -r '.data.createCommitOnBranch.commit.oid')"
              exit 0
            fi
            if printf '%s' "$OUT" | grep -qi "Expected head object"; then
              echo "main moved under us (attempt $attempt) — retrying"
              sleep 5
            else
              printf '%s\n' "$OUT" >&2
              exit 1
            fi
          done
          echo "FAIL: main moved on every retry" >&2
          exit 1

  web:
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: public/data

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The image header shows the release version: the Docker build has
          # no git metadata (review #7).
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  relay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-relay
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          # Repo-root context (ADR-0040): the relay core imports the canonical
          # room-code helper from src/lib/roomWords.ts, which a server-only
          # context cannot ship.
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Cloudflare hosted path (ADR-0038 architecture, ADR-0039 deployment):
  # the SPA assets worker and the relay DO worker, deployed by the same v*
  # tag that ships the GHCR images. The secrets are minted and scoped by
  # scripts/cf_ci_secrets.py — the workflows carry no Cloudflare credential
  # beyond the minimal API token.
  deploy-web:
    needs: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: public/data

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA (hosted relay origin)
        run: bun run build
        env:
          VITE_RELAY_WS_URL: wss://ws.flambette.app/ws

      - name: Deploy the web worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  deploy-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy the relay worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config server/wrangler.jsonc
